<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ReactPrueba/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#863bff" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada - Progresivas Décimo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f5f5f5;
        color: #1f2937;
        font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      main {
        width: 100%;
        max-width: 480px;
        padding: 40px 32px;
        border-top: 4px solid #ebbf1f;
        border-radius: 4px;
        background: #fff;
        box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.2),
          0 4px 5px 0 rgba(0, 0, 0, 0.14), 0 1px 10px 0 rgba(0, 0, 0, 0.12);
        text-align: center;
      }

      .codigo {
        margin: 0;
        font-size: clamp(72px, 22vw, 96px);
        font-weight: 800;
        line-height: 1;
        color: #863bff;
      }

      h1 {
        margin: 16px 0 8px;
        font-size: 20px;
        font-weight: 700;
      }

      p {
        margin: 0 0 8px;
        font-size: 14px;
        line-height: 1.6;
        color: #6b7280;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .boton {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 24px;
        border-radius: 4px;
        background: #863bff;
        color: #fff;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.02em;
        text-decoration: none;
      }

      .boton:hover,
      .boton:focus-visible {
        background: #6a2bd9;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="codigo" aria-hidden="true">404</p>
      <h1>Página no encontrada</h1>
      <p>La dirección que abriste no existe o cambió de lugar.</p>
      <p><code id="ruta"></code></p>
      <a class="boton" href="/ReactPrueba/">Volver al inicio</a>
    </main>
    <script>
      document.getElementById('ruta').textContent = location.pathname
    </script>
  </body>
</html>
